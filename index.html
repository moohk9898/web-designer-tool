<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Designer Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Welcome Web Designers!</h1>
    <p>This is a tool to help you design websites.</p>
    <textarea id="htmlInput" style="width: 100%; height: 200px;"><h1>Hello World!</h1></textarea>
    <iframe id="output" style="width: 100%; height: 300px;"></iframe>
    <script>
        const htmlInput = document.getElementById('htmlInput');
        const output = document.getElementById('output');

        htmlInput.addEventListener('input', function() {
            output.contentDocument.body.innerHTML = htmlInput.value;
        });
    </script>
    <div id="suggestions"></div>
</body>
</html>
